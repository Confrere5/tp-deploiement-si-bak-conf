<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automates | Supervision industrielle</title>
  <script src="/interface.js?v=2"></script>
  <link rel="stylesheet" href="/navigation.css?v=2">
  <script src="/automates.js" defer></script>
</head>
<body data-page="automates">
  <header id="app-header"></header>
  <main>
    <h1>Parc d’automates</h1>
    <p id="message" role="status"></p>

    <div class="workbench">
      <section class="panel">
        <h2>Automates configurés</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nom</th><th>Adresse</th><th>Port</th>
                <th>ID Modbus</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="automates"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2 id="form-title">Ajouter un automate</h2>
        <form id="automate-form">
          <div class="fields">
            <label class="wide">Nom de l’automate
              <input id="name" required placeholder="Ex. Ligne de conditionnement">
            </label>
            <label class="wide">Adresse IP ou nom d’hôte
              <input id="host" required placeholder="Ex. 192.168.1.20">
            </label>
            <label>Port TCP
              <input id="port" type="number" min="1" max="65535" value="502" required>
            </label>
            <label>Identifiant Modbus
              <input id="unit-id" type="number" min="0" max="255" value="1" required>
            </label>
          </div>
          <div class="actions">
            <button id="save" type="submit">Ajouter</button>
            <button id="cancel" type="button" hidden>Annuler la modification</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
