<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Variables | Supervision industrielle</title>
  <script src="/interface.js?v=2"></script>
  <link rel="stylesheet" href="/navigation.css?v=2">
  <script src="/variables.js" defer></script>
</head>
<body data-page="variables">
  <header id="app-header"></header>
  <main>
    <h1>Variables surveillées</h1>
    <p id="message" role="status"></p>

    <div class="workbench">
      <section class="panel">
        <h2>Configuration des lectures</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Variable</th><th>Automate</th><th>Registre</th>
                <th>Unité</th><th>Intervalle</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="variables"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2 id="form-title">Ajouter une variable</h2>
        <form id="variable-form">
          <div class="fields">
            <label class="wide">Automate
              <select name="automateId" required></select>
            </label>
            <label class="wide">Nom de la variable
              <input name="name" required placeholder="Ex. Pression de ligne">
            </label>
            <label>Type de registre
              <select name="registerType">
                <option value="holding">Holding register</option>
                <option value="input">Input register</option>
              </select>
            </label>
            <label>Adresse du registre
              <input name="registerAddress" type="number" min="0" max="65535" value="0" required>
            </label>
            <label>Type de donnée
              <select name="dataType">
                <option value="uint16">16 bits non signé</option>
                <option value="int16">16 bits signé</option>
              </select>
            </label>
            <label>Facteur multiplicateur
              <input name="scaleFactor" type="number" step="any" value="1" required>
            </label>
            <label>Unité
              <input name="unit" placeholder="Ex. bar">
            </label>
            <label>Intervalle (ms)
              <input name="intervalMs" type="number" min="1" value="2000" required>
            </label>
          </div>
          <div class="actions">
            <button id="save" type="submit" disabled>Ajouter</button>
            <button id="cancel" type="button" hidden>Annuler la modification</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
