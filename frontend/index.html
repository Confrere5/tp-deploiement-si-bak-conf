<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct | Supervision industrielle</title>
  <script src="/interface.js?v=2"></script>
  <link rel="stylesheet" href="/navigation.css?v=2">
  <link rel="stylesheet" href="/dashboard.css?v=2">
  <script src="/vendor/chart.umd.js" defer></script>
  <script src="/dashboard.js?v=2" defer></script>
</head>
<body data-page="direct">
  <header id="app-header"></header>
  <main>
    <h1>Supervision en direct</h1>
    <p id="message" role="status">Chargement des variables…</p>

    <section aria-labelledby="tiles-title">
      <h2 id="tiles-title">Variables à comparer</h2>
      <div id="tiles" class="tiles"></div>
    </section>

    <template id="signal-template">
      <label class="signal">
        <span class="signal-head">
          <span class="signal-name"></span>
          <input type="checkbox" checked>
        </span>
        <span class="reading">
          <span class="signal-value">—</span><small class="signal-unit"></small>
        </span>
        <span class="signal-foot">
          <span class="signal-state">En attente</span>
          <time></time>
        </span>
      </label>
    </template>

    <section class="panel" aria-labelledby="chart-title">
      <div class="chart-head">
        <div>
          <h2 id="chart-title">Comparaison des courbes</h2>
          <p class="hint">Cochez les variables à tracer. Les points s’accumulent depuis l’ouverture de la page.</p>
        </div>

        <label class="range-label">Fenêtre maximale
          <select id="window-size">
            <option value="2">2 minutes</option>
            <option value="5" selected>5 minutes</option>
            <option value="15">15 minutes</option>
          </select>
        </label>
      </div>

      <p id="plot-message" class="empty-plot">En attente des mesures…</p>
      <div id="plot" class="plot" hidden>
        <canvas id="chart" role="img" aria-label="Courbes des variables cochées">
          Les dernières valeurs sont aussi disponibles dans les tuiles.
        </canvas>
      </div>
    </section>
  </main>
</body>
</html>
