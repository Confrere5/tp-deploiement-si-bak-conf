<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historique | Supervision industrielle</title>
  <script src="/interface.js?v=2"></script>
  <link rel="stylesheet" href="/navigation.css?v=2">
  <script src="/historique.js" defer></script>
</head>
<body data-page="historique">
  <header id="app-header"></header>
  <main>
    <h1>Historique des mesures</h1>

    <section class="panel" aria-label="Recherche dans les mesures">
      <form id="history-form">
        <fieldset id="history-fields" disabled>
          <div class="fields">
            <label>Variable
              <select name="variableId" required></select>
            </label>
            <label>Début de la période
              <input name="from" type="datetime-local" required>
            </label>
            <label>Fin de la période
              <input name="to" type="datetime-local" required>
            </label>
          </div>
          <p class="hint">Heure locale du PC. Le début est inclus et la fin est exclue.</p>
          <div class="actions">
            <button type="submit">Afficher les mesures</button>
            <a id="download" class="download" download hidden>Télécharger le CSV</a>
          </div>
        </fieldset>
      </form>
    </section>

    <p id="message" role="status">Chargement des variables…</p>

    <section id="results" class="panel" hidden>
      <h2>Relevés de la période</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Date et heure locales</th><th>Valeur</th></tr>
          </thead>
          <tbody id="measures"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
