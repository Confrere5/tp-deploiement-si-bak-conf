<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historique | Supervision industrielle</title>
  <link rel="stylesheet" href="/navigation.css">
  <script src="/historique.js" defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f1f5f5;
      color: #172b36;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main { max-width: 1140px; margin: auto; padding: 32px 20px; }
    h1 { margin: 20px 0; }
    h2 { margin: 0 0 12px; font-size: 1.2rem; }

    section {
      margin-bottom: 18px;
      padding: 22px;
      border: 1px solid #cbd9da;
      border-radius: 12px;
      background: white;
    }

    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: 14px;
    }

    label { display: grid; gap: 5px; font-weight: 600; }

    select, input, button, .download {
      padding: 8px 12px;
      border: 1px solid #99afb1;
      border-radius: 6px;
      font: inherit;
    }

    select, input { min-width: 0; width: 100%; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    button, .download { cursor: pointer; }
    button { color: white; background: #006d68; }
    button:disabled { opacity: .55; cursor: default; }
    .download { color: #00645d; background: white; text-decoration: none; }
    .download:hover { background: #e9f4f3; }

    .hint { margin: 10px 0 0; color: #42595e; font-size: .92rem; }
    #message { font-weight: 600; }
    #message:empty { display: none; }
    #message.error { color: #a52823; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid #dce5e5;
      text-align: left;
    }
    td { font-variant-numeric: tabular-nums; }
  </style>
</head>

<body>
  <main>
    <nav class="tp-nav" aria-label="Navigation principale">
      <a href="/">Supervision</a>
      <a href="/automates.html">Automates</a>
      <a href="/variables.html">Variables</a>
      <a href="/historique.html" aria-current="page">Historique</a>
    </nav>

    <h1>Historique des mesures</h1>

    <section aria-label="Filtrer les mesures">
      <form id="history-form">
        <fieldset id="history-fields" disabled>
          <div class="fields">
            <label>Variable
              <select name="variableId" required></select>
            </label>

            <label>Début de la période
              <input name="from" type="datetime-local" required>
            </label>

            <label>Fin de la période
              <input name="to" type="datetime-local" required>
            </label>
          </div>

          <p class="hint">Heure locale du PC. Le début est inclus et la fin est exclue.</p>

          <div class="actions">
            <button type="submit">Afficher les mesures</button>
            <a id="download" class="download" download hidden>Télécharger le CSV</a>
          </div>
        </fieldset>
      </form>
    </section>

    <p id="message" role="status" aria-live="polite">Chargement des variables…</p>

    <section id="results" hidden>
      <h2>Mesures enregistrées</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Date et heure locales</th>
              <th scope="col">Valeur</th>
            </tr>
          </thead>
          <tbody id="measures"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
